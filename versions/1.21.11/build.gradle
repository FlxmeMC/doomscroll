plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
}

version = "${rootProject.mod_version}+mc${project.minecraft_version}"
group = rootProject.maven_group

base {
    archivesName = rootProject.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:rinku:${project.rinku_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
        }
        resources {
            srcDir rootProject.file('src/main/resources')
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', project.minecraft_range
    inputs.property 'loader_version', project.loader_version
    inputs.property 'java_version', project.java_version
    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft_range': project.minecraft_range,
            'loader_version': project.loader_version,
            'java_version': project.java_version
        )
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}
