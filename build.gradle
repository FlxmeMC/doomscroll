plugins {
    id 'java'
}

group = project.maven_group
version = project.mod_version

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            include 'dev/doomscrolling/browser/CommentsState.java'
            include 'dev/doomscrolling/browser/ShortsState.java'
            include 'dev/doomscrolling/browser/InstagramReelsBridge.java'
            include 'dev/doomscrolling/browser/YouTubeShortsBridge.java'
            include 'dev/doomscrolling/config/DoomscrollingConfig.java'
            include 'dev/doomscrolling/ui/CommentsLayout.java'
            include 'dev/doomscrolling/ui/HudBounds.java'
        }
        resources {
            setSrcDirs([])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

def versionProjects = [
    ':versions:26.3',
    ':versions:26.2',
    ':versions:26.1.2',
    ':versions:1.21.11',
    ':versions:1.21.1'
]

tasks.register('collectJars', Copy) {
    dependsOn(versionProjects.collect { "${it}:build" })
    into layout.buildDirectory.dir('libs')
    versionProjects.each { path ->
        def sub = project(path)
        from(sub.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar'
            exclude '*-dev.jar'
        }
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn('collectJars')
}
